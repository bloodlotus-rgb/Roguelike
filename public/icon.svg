<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- La Estirpe: a flame in ink on old paper, inside the dark of the dungeon. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="56%" r="48%">
      <stop offset="0" stop-color="#f1e4c6"/>
      <stop offset="0.62" stop-color="#d9c49a"/>
      <stop offset="1" stop-color="#8c7a5c"/>
    </radialGradient>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#211b17" stroke-width="2.2"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="#110e0c"/>
  <circle cx="256" cy="268" r="190" fill="url(#glow)"/>
  <circle cx="256" cy="268" r="190" fill="none" stroke="#211b17" stroke-width="10"/>
  <!-- Shade at the foot of the page, hatched. -->
  <path d="M86 330 A190 190 0 0 0 426 330 Z" fill="url(#hatch)" opacity="0.55"/>
  <!-- The flame. -->
  <path d="M256 104 C300 168 344 206 336 268 C330 318 296 346 256 346 C216 346 182 318 176 268 C170 220 210 196 226 150 C238 184 246 196 262 206 C266 172 262 140 256 104 Z"
        fill="#d9822b" stroke="#211b17" stroke-width="10" stroke-linejoin="round"/>
  <path d="M256 214 C280 246 292 268 288 292 C284 316 270 328 256 328 C242 328 228 316 224 292 C220 266 240 250 256 214 Z"
        fill="#f6e2b0" stroke="#211b17" stroke-width="7" stroke-linejoin="round"/>
  <!-- The wick and the candle. -->
  <rect x="206" y="346" width="100" height="72" fill="#ece2cb" stroke="#211b17" stroke-width="10"/>
  <line x1="226" y1="360" x2="226" y2="408" stroke="#211b17" stroke-width="4"/>
</svg>
