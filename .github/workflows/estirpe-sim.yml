name: Estirpe Sim - TypeScript y Jenga
on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - 'feat/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run --silent jenga:report -- estirpe
      - run: npm run --silent ecology:report -- --ticks 48 estirpe
      - run: npm run --silent ecology:dispersal -- --case whole --ticks 24 estirpe
